name: Item 6 hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: item6-hardening-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Item 6 / Dependency Review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions with zizmor
        # Blocking after the live trusted-trigger baseline was reconciled.
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: "1.30.1"

      - name: Create seeded unsafe Actions probe
        run: |
          cat > "${RUNNER_TEMP}/zizmor-seeded.yml" <<'YAML'
          name: seeded-zizmor-defect
          on:
            pull_request_target:
          jobs:
            seeded:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
                - run: ./untrusted-repository-script.sh
          YAML

      - name: Prove zizmor detects the seeded unsafe pattern
        id: zizmor_seed
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ${{ runner.temp }}/zizmor-seeded.yml
          advanced-security: false
          annotations: false
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: "1.30.1"

      - name: Enforce zizmor negative-control result
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.zizmor_seed.outcome }}
        run: |
          test "$PROBE_OUTCOME" = failure || {
            echo "::error::Seeded unsafe Actions pattern was not rejected by zizmor."
            exit 1
          }

  renovate-config:
    name: Item 6 / Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Prove malformed Renovate configuration fails
        shell: bash
        run: |
          set -euo pipefail
          bad="$(mktemp --suffix=.json)"
          trap 'rm -f "$bad"' EXIT
          printf '%s\n' '{"extends":["config:recommended"],"packageRules":[' > "$bad"
          set +e
          npx --yes --package=renovate@44.133.0 renovate-config-validator --strict "$bad"
          status=$?
          set -e
          test "$status" -ne 0 || {
            echo "::error::Malformed Renovate configuration unexpectedly passed validation."
            exit 1
          }

      - name: Validate final Renovate configuration
        run: npx --yes --package=renovate@44.133.0 renovate-config-validator --strict renovate.json

# Provenance/SBOM attestation is intentionally N/A here. IRS production is
# rebuilt and deployed by Cloudflare Pages from repository source; this GitHub
# workflow does not publish or receive the immutable Pages artifact/digest.
# Attesting a generated repository SBOM would therefore not attest the running
# production unit. Add provenance only when Cloudflare exposes that artifact.
