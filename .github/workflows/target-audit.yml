name: IRS scheduled target audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe all authorised redirect targets
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
        run: npm run audit:targets
      - name: Retain the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irs-target-audit-${{ github.run_id }}
          path: reports/irs-target-audit.json
          if-no-files-found: warn
          retention-days: 90
