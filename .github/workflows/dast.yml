name: DAST penetration test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.repository }}
  cancel-in-progress: false

env:
  DAST_ENABLED: ${{ vars.DAST_ENABLED || 'false' }}
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || '' }}

jobs:
  zap-full-scan:
    name: OWASP ZAP full active scan
    if: ${{ vars.DAST_ENABLED == 'true' && vars.DAST_TARGET_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Resolve exact default-branch SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out trusted evidence helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Refuse unauthorised/non-HTTPS remote target
        shell: bash
        run: |
          set -euo pipefail
          case "$DAST_TARGET_URL" in https://*) ;; *) echo "::error::DAST_TARGET_URL must be an authorised HTTPS endpoint."; exit 1;; esac
      - name: Run authorised ZAP full scan
        id: zap
        continue-on-error: true
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: dast-zap-full-${{ github.run_id }}

      - name: Build exact-run DAST evidence manifest
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          jq -n             --arg repository "$GITHUB_REPOSITORY"             --arg sha "$TARGET_SHA"             --arg run_id "$GITHUB_RUN_ID"             --arg run_attempt "$GITHUB_RUN_ATTEMPT"             --arg target "$DAST_TARGET_URL"             --arg scan_outcome "$ZAP_OUTCOME"             '{kind:"dast",repository:$repository,default_sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,target_url:$target,scan_outcome:$scan_outcome}'             > dast-evidence.json

      - name: Persist and verify DAST evidence in canonical R2 layout
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EVIDENCE_STATUS: ${{ steps.zap.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dast-r2"
          cp dast-evidence.json "$RUNNER_TEMP/dast-r2/summary.json"
          for file in report_html.html report_md.md report_json.json; do
            test ! -f "$file" || cp "$file" "$RUNNER_TEMP/dast-r2/$file"
          done
          python3 .github/scripts/persist_ci_report_r2.py dast "$TARGET_SHA" "$RUNNER_TEMP/dast-r2"

      - name: Enforce ZAP result
        if: always()
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          test "$ZAP_OUTCOME" = success || {
            echo "::error::OWASP ZAP active scan failed."
            exit 1
          }
