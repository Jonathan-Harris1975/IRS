name: IRS Cloudflare Pages deployment watch

on:
  workflow_run:
    workflows: ["Production verification"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irs-pages-deployment-watch
  cancel-in-progress: true

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check Cloudflare Pages deployment-watch configuration
        id: pages_config
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
        run: |
          if [ -n "${CF_ACCOUNT_ID:-}" ] && [ -n "${CF_PAGES_PROJECT_NAME:-}" ] && [ -n "${CF_PAGES_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Pages deployment watcher is not configured; exact-SHA deployment attestation and downstream smoke dispatch are skipped."
          fi
      - name: Watch the production Pages deployment
        if: steps.pages_config.outputs.configured == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run watch:pages
      - name: Audit every authorised live redirect target
        run: npm run audit:targets
        env:
          IRS_TARGET_REPORT_PATH: reports/irs-target-audit.json
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
      - name: Record exact-SHA Pages deployment attestation
        if: steps.pages_config.outputs.configured == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","service":"IRS","status":"production-deployment-and-target-audit-green"}\n' \
            "$GITHUB_REPOSITORY" "$DEPLOYED_SHA" "$GITHUB_RUN_ID" > reports/deployment-attestation.json
      - name: Upload redirect target audit
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: irs-live-target-audit-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            reports/irs-target-audit.json
            reports/deployment-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Trigger central ecosystem smoke when cross-repository dispatch is configured
        if: steps.pages_config.outputs.configured == 'true'
        env:
          ECOSYSTEM_SMOKE_DISPATCH_TOKEN: ${{ secrets.ECOSYSTEM_SMOKE_DISPATCH_TOKEN }}
          ECOSYSTEM_SMOKE_REPOSITORY: ${{ vars.ECOSYSTEM_SMOKE_REPOSITORY }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ECOSYSTEM_SMOKE_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::ECOSYSTEM_SMOKE_DISPATCH_TOKEN is not configured in IRS; deployment and redirect-target verification are complete, but the optional cross-repository MAST dispatch was skipped."
            exit 0
          fi
          target="${ECOSYSTEM_SMOKE_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/MAST}"
          payload="$(jq -cn --arg ref main --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" '{ref:$ref,inputs:{source_repository:$repo,source_sha:$sha}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ECOSYSTEM_SMOKE_DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${target}/actions/workflows/ecosystem-smoke.yml/dispatches"
