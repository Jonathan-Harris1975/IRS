name: Production verification

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

jobs:
  verify:
    name: Deterministic repository verification
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "10.9.9"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run committed-secret and repository verification
        run: npm run verify

  live_target_audit:
    name: Live redirect target audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "10.9.9"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit live redirect targets
        env:
          IRS_TARGET_REPORT_PATH: reports/irs-target-audit.json
          IRS_TARGET_CONCURRENCY: '4'
          IRS_TARGET_TIMEOUT_MS: '12000'
          IRS_TARGET_STALENESS_HOURS: '36'
        run: npm run audit:targets
      - name: Retain live-target report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: irs-pre-release-target-audit-${{ github.sha }}
          path: |
            reports/irs-target-audit.json
            reports/irs-target-status.json
          if-no-files-found: error
          retention-days: 90

  notify_failure:
    name: Notify central operations on CI failure
    needs: [verify, live_target_audit]
    if: ${{ always() && (needs.verify.result == 'failure' || needs.verify.result == 'cancelled' || needs.live_target_audit.result == 'failure' || needs.live_target_audit.result == 'cancelled') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service IRS
          --event-type ci_failed
          --title "IRS GitHub Actions failed"
          --summary "The governed CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [verify, live_target_audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - name: Require deterministic checks and any applicable live audit
        env:
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_LIVE: ${{ needs.live_target_audit.result }}
        run: |
          test "$RESULT_VERIFY" = "success"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$RESULT_LIVE" = "skipped"
          else
            test "$RESULT_LIVE" = "success"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

  ci_gate:
    name: ci-gate
    needs: [release_gate, autonomous_repair_guard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - name: Enforce aggregate CI result
        env:
          RELEASE_GATE_RESULT: ${{ needs.release_gate.result }}
          REPAIR_GUARD_RESULT: ${{ needs.autonomous_repair_guard.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_GATE_RESULT" = "success" || { echo "release_gate was $RELEASE_GATE_RESULT" >&2; exit 1; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$REPAIR_GUARD_RESULT" = "success"
          fi


  autonomous_repair_guard:
    name: Autonomous repair marker gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require autonomous repair request to be resolved
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          # Fork PR commits may be absent even with a full checkout.
          for sha in "$base_sha" "$head_sha"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          changed_markers="$(git diff --name-only --diff-filter=AMR "$merge_base" "$head_sha" -- '.autonomy/repair-request-*.md')"
          if [ -n "$changed_markers" ]; then
            echo "::error::This PR introduces an unresolved autonomous repair request. Fix the underlying failure, then remove the repair-request marker."
            printf '%s\n' "$changed_markers"
            exit 1
          fi
