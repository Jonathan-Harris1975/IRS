name: Production verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Deterministic repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run committed-secret and repository verification
        run: npm run verify

  live_target_audit:
    name: Live redirect target audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit live redirect targets
        env:
          IRS_TARGET_REPORT_PATH: reports/irs-target-audit.json
          IRS_TARGET_CONCURRENCY: '4'
          IRS_TARGET_TIMEOUT_MS: '12000'
          IRS_TARGET_STALENESS_HOURS: '36'
        run: npm run audit:targets
      - name: Retain live-target report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irs-pre-release-target-audit-${{ github.sha }}
          path: |
            reports/irs-target-audit.json
            reports/irs-target-status.json
          if-no-files-found: error
          retention-days: 90

  notify_failure:
    name: Notify central operations on CI failure
    needs: [verify, live_target_audit]
    if: ${{ always() && (needs.verify.result == 'failure' || needs.verify.result == 'cancelled' || needs.live_target_audit.result == 'failure' || needs.live_target_audit.result == 'cancelled') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service IRS
          --event-type ci_failed
          --title "IRS GitHub Actions failed"
          --summary "The governed CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [verify, live_target_audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require deterministic checks and any applicable live audit
        env:
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_LIVE: ${{ needs.live_target_audit.result }}
        run: |
          test "$RESULT_VERIFY" = "success"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$RESULT_LIVE" = "skipped"
          else
            test "$RESULT_LIVE" = "success"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90
