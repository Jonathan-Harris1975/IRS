name: Weekend CI phase launcher

on:
  schedule:
    - cron: "0 6 * * 6"
    - cron: "0 5 * * 6"
    - cron: "0 16 * * 6"
    - cron: "0 15 * * 6"
    - cron: "0 6 * * 0"
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to dispatch"
        required: true
        default: ci
        type: choice
        options:
          - ci
          - dast
          - council

permissions:
  actions: write
  contents: read

concurrency:
  group: weekend-phase-launcher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Europe/London phase slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase || '' }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
        shell: bash
        run: |
          set -euo pipefail
          phase=""; workflow=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
            case "$phase" in
              ci) workflow="ci.yml" ;;
              dast) workflow="dast.yml" ;;
              council) workflow="council.yml" ;;
              *) echo "::error::Unsupported phase $phase"; exit 1 ;;
            esac
          else
            # GitHub scheduled jobs may start late. Resolve the immutable cron
            # expression that fired, not the runner's eventual wall-clock minute.
            london_offset="$(TZ=Europe/London date '+%z')"
            case "${SCHEDULE_EXPR}:${london_offset}" in
              "0 5 * * 6:+0100"|"0 6 * * 6:+0000")
                phase="ci"; workflow="ci.yml" ;;
              "0 15 * * 6:+0100"|"0 16 * * 6:+0000")
                phase="dast"; workflow="dast.yml" ;;
              "0 5 * * 0:+0100"|"0 6 * * 0:+0000")
                phase="council"; workflow="council.yml" ;;
            esac
          fi
          if [ -z "$phase" ]; then
            echo "Scheduled UTC/DST duplicate is outside the intended Europe/London slot; no action."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "run=true"
            echo "phase=$phase"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch phase workflow
        if: steps.slot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PHASE: ${{ steps.slot.outputs.phase }}
          WORKFLOW: ${{ steps.slot.outputs.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH" || { echo "::error::Repository default branch is unavailable"; exit 1; }
          workflows=("$WORKFLOW")
          if [ "$PHASE" = "ci" ]; then
            workflows+=("codeql.yml" "security.yml" "target-audit.yml" "item6-hardening.yml")
          fi
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          done

      - name: Record allocated windows
        if: always()
        run: |
          echo "CI: Sat 06:00–Sat 08:30"
          echo "DAST: Sat 16:00–Sat 18:00"
          echo "Council: Sun 06:00–Sun 08:30"
          echo "Weekend operating envelope: Friday 20:00 to Monday 04:00 Europe/London"
