name: Security and repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irs-security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: '0.74.0'
  GITLEAKS_VERSION: '8.30.1'
  ACTIONLINT_VERSION: '1.7.12'
  LYCHEE_VERSION: '0.24.2'
  SCORECARD_VERSION: '5.5.0'

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify branch PR safety and idempotency
        run: python3 .github/scripts/test_branch_pr_automation.py
      - name: Verify autonomy lifecycle regressions
        run: python3 .github/scripts/test_autonomy_lifecycle.py
      - name: Verify PR blocker recovery regressions
        run: python3 .github/scripts/test_pr_blocker_recovery.py
      - name: Install pinned CI tools
        run: python scripts/install_ci_tools.py trivy gitleaks actionlint

      - name: Trivy filesystem vulnerability and misconfiguration scan
        run: >-
          .ci-tools/bin/trivy fs .
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress

      - name: Verify Gitleaks exact-fingerprint ignore contract
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/.ci-tools/bin/gitleaks
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cd "$fixture"
          git init -q
          git config user.name 'IRS CI'
          git config user.email 'ci@example.invalid'

          canary_one="ghp_$(printf 'irs-gitleaks-ignore-contract-one' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_one" > ignored.txt
          git add ignored.txt
          git commit -qm 'synthetic ignored finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --report-format json --report-path first.json --exit-code 42
          first_status=$?
          set -e
          test "$first_status" -eq 42 || {
            echo "::error::Gitleaks canary was not detected before allowlisting (exit $first_status)."
            exit 1
          }

          fingerprint="$(jq -er '.[0].Fingerprint' first.json)"
          printf '%s\n' "$fingerprint" > .gitleaksignore

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          ignored_status=$?
          set -e
          test "$ignored_status" -eq 0 || {
            echo "::error::Exact Gitleaks fingerprint was not suppressed (exit $ignored_status)."
            exit 1
          }

          canary_two="ghp_$(printf 'irs-gitleaks-ignore-contract-two' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_two" > unlisted.txt
          git add .gitleaksignore unlisted.txt
          git commit -qm 'synthetic unlisted finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          unlisted_status=$?
          set -e
          test "$unlisted_status" -eq 42 || {
            echo "::error::Unlisted synthetic finding did not fail Gitleaks (exit $unlisted_status)."
            exit 1
          }

      - name: Gitleaks full-history secret scan
        id: gitleaks
        continue-on-error: true
        run: >-
          .ci-tools/bin/gitleaks git .
          --redact
          --no-banner
          --report-format json
          --report-path gitleaks-report.json
          --exit-code 1

      - name: Upload redacted Gitleaks diagnostic report
        if: always() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-diagnostic-${{ github.run_id }}
          path: gitleaks-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo 'Gitleaks detected potential secrets. Download the redacted diagnostic artifact for rule, file, commit, line and fingerprint metadata.' >&2
          exit 1

      - name: Validate GitHub Actions workflows
        run: .ci-tools/bin/actionlint -color

      - name: Prove actionlint rejects a seeded workflow defect
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp --suffix=.yml)"
          trap 'rm -f "$probe"' EXIT
          cat > "$probe" <<'YAML'
          name: seeded-actionlint-defect
          on: push
          jobs:
            seeded:
              steps:
                - run: echo "this job intentionally has no runs-on"
          YAML
          set +e
          .ci-tools/bin/actionlint -color "$probe"
          status=$?
          set -e
          test "$status" -ne 0 || {
            echo "::error::Seeded actionlint defect unexpectedly passed."
            exit 1
          }

  link_integrity:
    name: Lychee link integrity
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Lychee
        continue-on-error: true
        run: python scripts/install_ci_tools.py lychee
      - name: Check repository links
        continue-on-error: true
        run: >-
          .ci-tools/bin/lychee
          --no-progress
          --cache
          --max-retries 2
          --timeout 20
          README.md SECURITY.md CHANGELOG.md docs public

  scorecard:
    name: OpenSSF Scorecard
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Install pinned Scorecard CLI from source
        continue-on-error: true
        env:
          GOBIN: ${{ runner.temp }}/scorecard-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install "github.com/ossf/scorecard/v5@v${SCORECARD_VERSION}"
          "$GOBIN/scorecard" version
      - name: Run OpenSSF Scorecard
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORECARD_BIN: ${{ runner.temp }}/scorecard-bin/scorecard
        run: |
          set -euo pipefail
          "$SCORECARD_BIN" --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
          cat scorecard.json

