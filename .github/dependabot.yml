version: 2
updates:
  # There are currently no npm dependencies; GitHub Actions are the active
  # dependency-update surface. Re-add npm when application packages exist.
  # Renovate owns version updates; Dependabot remains configured for security/update metadata.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci)"
